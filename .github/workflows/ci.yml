name: NestSphere ERP Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Backend NestJS & Prisma Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        run: cd backend && npm install --legacy-peer-deps

      - name: Validate Prisma Schema
        run: cd backend && npx prisma validate

      - name: Generate Prisma Client
        run: cd backend && npx prisma generate

      - name: Build NestJS Backend
        run: cd backend && npx nest build

  frontend-ci:
    name: Frontend React TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: cd frontend && npm install --legacy-peer-deps

      - name: Verify TypeScript Type Safety
        run: cd frontend && npx tsc --noEmit

      - name: Build Vite Production Assets
        run: cd frontend && npm run build
