name: NestSphere ERP CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-qa-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/nestsphere_db?schema=public"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: cd backend && npm install --legacy-peer-deps

      - name: Validate & Generate Prisma Schema
        run: cd backend && npx prisma validate && npx prisma generate

      - name: Compile NestJS Production Build
        run: cd backend && npx nest build

  frontend-qa-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: cd frontend && npm install --legacy-peer-deps

      - name: Typecheck Frontend
        run: cd frontend && npx tsc --noEmit

      - name: Compile Vite Bundle
        run: cd frontend && npm run build
