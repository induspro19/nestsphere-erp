apiVersion: v1
kind: ConfigMap
metadata:
  name: nestsphere-config
data:
  NODE_ENV: "production"
  PORT: "3000"
  REDIS_HOST: "nestsphere-redis-svc"
  REDIS_PORT: "6379"

---
apiVersion: v1
kind: Secret
metadata:
  name: nestsphere-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql://nestsphere:nestsphere_secret_2026@nestsphere-db-svc:5432/nestsphere_erp?schema=public"
  JWT_SECRET: "production_super_secret_jwt_key_2026_nestsphere"
  JWT_REFRESH_SECRET: "production_super_secret_refresh_jwt_key_2026_nestsphere"
