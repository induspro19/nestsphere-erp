<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting to NestSphere ERP...</title>
    <script type="text/javascript">
      // Smart GitHub Pages SPA Redirect to NestSphere ERP HashRouter
      (function() {
        var path = window.location.pathname;
        var repoName = '/nestsphere-erp';
        
        // If user accessed root domain or non-repo path like induspro19.github.io/login
        if (!path.startsWith(repoName)) {
          var targetHash = '#' + path;
          window.location.replace(repoName + '/' + targetHash + window.location.search);
        } else {
          // If inside repo path like /nestsphere-erp/login
          var subPath = path.replace(repoName, '');
          if (subPath && subPath !== '/') {
            window.location.replace(repoName + '/#' + subPath + window.location.search);
          }
        }
      }());
    </script>
  </head>
  <body style="background:#0f172a; color:#ffffff; font-family:sans-serif; text-align:center; padding-top:20vh;">
    <h2>Redirecting to NestSphere ERP...</h2>
    <p>Please wait while we redirect you to the application portal.</p>
  </body>
</html>
