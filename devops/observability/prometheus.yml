global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'nestsphere-backend'
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['backend:3000']

  - job_name: 'nestsphere-postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'nestsphere-redis'
    static_configs:
      - targets: ['redis-exporter:9121']
